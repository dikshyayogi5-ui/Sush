<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be mine 💖</title>

<style>
    * {
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 20px;
        text-align: center;
        width: 90%;
        max-width: 350px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        z-index: 2;
    }

    h1 {
        color: #ff4d6d;
        margin-bottom: 20px;
        font-size: 24px;
    }

    .buttons {
        margin-top: 20px;
        position: relative;
        height: 60px;
    }

    button {
        padding: 10px 25px;
        font-size: 16px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yesBtn {
        background: #ff4d6d;
        color: white;
        margin-right: 10px;
    }

    #noBtn {
        background: #ccc;
        position: absolute;
    }

    .message {
        display: none;
        color: #ff4d6d;
        font-size: 18px;
        margin-top: 15px;
    }

    /* Heart balloons */
    .heart {
        position: absolute;
        color: #ff4d6d;
        font-size: 24px;
        animation: float 8s linear infinite;
        opacity: 0.7;
    }

    @keyframes float {
        0% {
            transform: translateY(100vh);
            opacity: 0;
        }
        10% { opacity: 1; }
        100% {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }
   body {
  min-height: 100vh;
  min-height: 100dvh;
  height: auto;
  padding: 20px;
  overflow-x: hidden;
  overflow-y: auto;
}

.container {
  width: 100%;
  max-width: 350px;
  padding: 24px;
}

h1 {
  font-size: clamp(22px, 6vw, 28px);
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  height: auto;
  min-height: 60px;
}

#yesBtn {
  margin-right: 0;
}

#noBtn {
  position: static;
}

button {
  min-height: 44px;
}

.message {
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">
    <h1>Will you be mine forever and ever? 💘</h1>

    <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 😅</button>
    </div>

    <div class="message" id="msg">
        I knew you would say yes 🥰  
        I love you so much ❤️  
        You mean the world to me 🌍💞
    </div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const msg = document.getElementById("msg");

    // Move NO button away
    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("click", moveButton);

    function moveButton() {
         if (window.matchMedia("(hover: none), (pointer: coarse)").matches) {
    noBtn.style.transform = "none";
    noBtn.dataset.x = "0";
    noBtn.dataset.y = "0";
    return;
  }
  const rect = noBtn.getBoundingClientRect();

  const currentX = parseFloat(noBtn.dataset.x || "0");
  const currentY = parseFloat(noBtn.dataset.y || "0");

  const baseX = rect.left - currentX;
  const baseY = rect.top - currentY;

  const x = 12 + Math.random() *
    Math.max(0, window.innerWidth - rect.width - 24);

  const y = 12 + Math.random() *
    Math.max(0, window.innerHeight - rect.height - 24);

  const offsetX = x - baseX;
  const offsetY = y - baseY;

  noBtn.dataset.x = offsetX;
  noBtn.dataset.y = offsetY;

  noBtn.style.transform =
    `translate(${offsetX}px, ${offsetY}px)`;
}

    // YES button action
    yesBtn.addEventListener("click", () => {
        msg.style.display = "block";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
    });

    // Create floating hearts
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (5 + Math.random() * 5) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 8000);
    }

    setInterval(createHeart, 500);
</script>

</body>
</html>
