<style>
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d5, #c4b5fd, #a5f3fc);
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 30px;
    box-sizing: border-box;
    text-align: center;
    background: #fff7fc;
    border: 3px solid white;
    border-radius: 28px;
    box-shadow: 0 15px 40px #8050a330;
  }

  h1 {
    color: #db2777;
  }

  #question {
    color: #7c3aed;
    font-size: 23px;
    font-weight: bold;
  }

  #progress {
    color: #9333ea;
  }

  button {
    margin: 8px;
    padding: 12px 24px;
    border: none;
    border-radius: 20px;
    font-size: 17px;
    cursor: pointer;
    background: #fbcfe8;
    color: #9d174d;
  }

  #answers button:nth-child(even) {
    background: #bfdbfe;
    color: #1e40af;
  }

  #nextBtn {
    background: #ddd6fe;
    color: #5b21b6;
  }

  #result {
    min-height: 45px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
<body>
  <div class="card">
    <h1>How well do you know me? 💖</h1>
    <p id="progress"></p>
    <p id="question"></p>

    <div id="answers"></div>

    <p id="result" aria-live="polite"></p>
    <button id="nextBtn" onclick="nextQuestion()" hidden>
      Next question →
    </button>
  </div>

  <script>
    const questions = [
      {
        question: "What is my favourite colour?",
        answers: ["Pink", "Blue"],
        correct: "Blue"
      },
      {
  question: "What is my favourite food?",
  answers: ["Pizza", "Momo"],
  correct: "Momo"
},
      {
        question: "What kind of activity do I like to do?",
        answers: ["Adrenaline fun", "Late night Party"],
        correct: "Adrenaline fun"
      },
      {
        question: "Who is my favourite person?",
        answers: ["You 💖", "Someone else"],
        correct: "You 💖"
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function showQuestion() {
      const item = questions[currentQuestion];

      document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      document.getElementById("question").textContent = item.question;
      document.getElementById("result").textContent = "";
      document.getElementById("nextBtn").hidden = true;

      const answers = document.getElementById("answers");
      answers.replaceChildren();

      item.answers.forEach(function(answer) {
        const button = document.createElement("button");
        button.textContent = answer;
        button.onclick = function() {
          checkAnswer(answer);
        };
        answers.appendChild(button);
      });
    }

    function checkAnswer(answer) {
      const item = questions[currentQuestion];
      const result = document.getElementById("result");

      if (answer === item.correct) {
        score++;
       if (item.question === "Who do I love most?") {
  result.textContent = "Of course you, silly 💖";
} else {
  result.textContent = "Correct! You know me well 💖";
},
        result.style.color = "#238636";
      } else {
        result.textContent = "Opps wrong 😅";
        result.style.color = "#b83280";
      }

      document.querySelectorAll("#answers button").forEach(function(button) {
        button.disabled = true;
      });

      const nextButton = document.getElementById("nextBtn");
      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "See my score ✨"
          : "Next question →";
      nextButton.hidden = false;
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        document.getElementById("progress").textContent = "Quiz complete! 🎉";
        document.getElementById("question").textContent =
          `You got ${score} out of ${questions.length}!`;
        document.getElementById("answers").replaceChildren();
        document.getElementById("result").textContent =
          "You're still my favourite person 💖";

        const nextButton = document.getElementById("nextBtn");
        nextButton.textContent = "Play again";
        nextButton.onclick = function() {
          location.reload();
        };
      }
    }

    showQuestion();
  </script>
</body>
</html>
